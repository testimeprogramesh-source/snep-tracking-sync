name: Sinkronizo Gjurmimin nga Ultra Post te Supabase

# Xhirohet ne 2 menyra:
#   1) "*/15 6-15 * * *" -- skanim i SHPEJTE, çdo 15 min, VETEM gjate orarit
#      08:00-18:00 (ora e Shqiperise, UTC+2 ne kohen verore). Oret 6-15 ne
#      UTC = 08:00-17:59 ne Shqiperi -- xhirimi i fundit i dites eshte
#      17:45, asnje xhirim pas ores 18:00.
#      KUJDES (ndryshimi i ores ne Shqiperi, fund tetori): kur Shqiperia
#      kalon ne oren dimerore (UTC+1), kjo dritare 6-15 UTC do te behet
#      07:00-16:59 ne Shqiperi ne vend te 08:00-17:59 -- duhet rregulluar
#      atehere ne 7-16.
#   2) "30 2 * * *"    -- skanim i PLOTE, 1 here ne dite (02:30 UTC =
#      04:30 ne Shqiperi, para se te fillojne skanimet e shpejta):
#      kalon te GJITHA pakot, per te kapur çdo pako qe skanimi i shpejte
#      mund ta kete "harruar" (p.sh. nje pako e vjeter qe befas ndryshon).
# Mund te xhirohet edhe manualisht nga skeda "Actions" (buton "Run
# workflow"), ne cdo kohe (pa kufizim orari) -- me mundesi per te zgjedhur
# skanim te plote nga kutia e checkbox-it.
on:
  schedule:
    - cron: "*/15 6-15 * * *"
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      full_scan:
        description: "Skano TE GJITHA pakot (jo vetem ndryshimet)"
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # 180 min (3 ore): skanimi i PLOTE i pare ("backfill"-i, ~30 dite histori
    # me 50+/dite = ~1500 pako per t'u hapur nje-nga-nje) mund te marre me
    # shume se 45 min. 45 min DESHTOI ne praktike (20/09/2026) -- u rrit.
    # Xhirimet e ardhshme te plota do te jene MË TE SHPEJTA (shumica e
    # pakove tashme jane "seen" -- shih ultra_parcels_seen), keshtu qe ky
    # kufi i larte praktikisht s'do te arrihet me pas backfill-it te pare.
    timeout-minutes: 180

    steps:
      - name: Merr kodin e repository-t
        uses: actions/checkout@v4

      - name: Instalo Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalo Chrome (per Selenium)
        uses: browser-actions/setup-chrome@v1

      - name: Instalo varesite Python
        run: pip install selenium webdriver-manager requests

      - name: Xhiro sinkronizimin (skanon vete te gjitha pakot e reja/ndryshuara)
        env:
          ULTRA_USERNAME: ${{ secrets.ULTRA_USERNAME }}
          ULTRA_PASSWORD: ${{ secrets.ULTRA_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FULL_SCAN: ${{ (github.event.schedule == '30 2 * * *' || github.event.inputs.full_scan == 'true') && '1' || '' }}
        run: python ultra_portal_scrape.py

      # Nese ndonje hap deshton (timeout, element i pagjetur, etj.), script-i
      # ruan vete nje foto ekrani (.png) + HTML-in e faqes (.html) ne dosjen
      # debug/. Ky hap i ngarkon ato si skedar te shkarkueshem te vete xhirimi
      # -- "if: always()" ben qe te ngarkohen edhe nese hapi i mesiperm
      # deshton (exit code != 0), jo vetem kur "duket" i suksesshem.
      - name: Ngarko diagnostikimin (nese ka)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_number }}
          path: debug/
          if-no-files-found: ignore
          retention-days: 5
