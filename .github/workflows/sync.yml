name: Sinkronizo Gjurmimin nga Ultra Post te Supabase

# Xhirohet ne 2 menyra:
#   1) "*/15 * * * *"  -- skanim i SHPEJTE, çdo 15 min: kontrollon vetem
#      pakot e reja ose te ndryshuara qe nga hera e fundit.
#   2) "30 2 * * *"    -- skanim i PLOTE, 1 here ne dite (02:30 UTC):
#      kalon te GJITHA pakot, per te kapur çdo pako qe skanimi i shpejte
#      mund ta kete "harruar" (p.sh. nje pako e vjeter qe befas ndryshon).
# Mund te xhirohet edhe manualisht nga skeda "Actions" (buton "Run
# workflow"), me mundesi per te zgjedhur skanim te plote nga kutia e
# checkbox-it.
on:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      full_scan:
        description: "Skano TE GJITHA pakot (jo vetem ndryshimet)"
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # 45 min, sepse skanimi i PLOTE (dhe sidomos xhirimi i pare, "backfill"-i
    # historik) mund te marre shume me shume kohe se nje skanim i shpejte.
    timeout-minutes: 45

    steps:
      - name: Merr kodin e repository-t
        uses: actions/checkout@v4

      - name: Instalo Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalo Chrome (per Selenium)
        uses: browser-actions/setup-chrome@v1

      - name: Instalo varesite Python
        run: pip install selenium webdriver-manager requests

      - name: Xhiro sinkronizimin (skanon vete te gjitha pakot e reja/ndryshuara)
        env:
          ULTRA_USERNAME: ${{ secrets.ULTRA_USERNAME }}
          ULTRA_PASSWORD: ${{ secrets.ULTRA_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FULL_SCAN: ${{ (github.event.schedule == '30 2 * * *' || github.event.inputs.full_scan == 'true') && '1' || '' }}
        run: python ultra_portal_scrape.py

      # Nese ndonje hap deshton (timeout, element i pagjetur, etj.), script-i
      # ruan vete nje foto ekrani (.png) + HTML-in e faqes (.html) ne dosjen
      # debug/. Ky hap i ngarkon ato si skedar te shkarkueshem te vete xhirimi
      # -- "if: always()" ben qe te ngarkohen edhe nese hapi i mesiperm
      # deshton (exit code != 0), jo vetem kur "duket" i suksesshem.
      - name: Ngarko diagnostikimin (nese ka)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_number }}
          path: debug/
          if-no-files-found: ignore
          retention-days: 5
